{% extends "base.html" %}

{% block content %}

<h2>{{ group.name }}</h2>

<h3>Members</h3>

{% for member in members %}

<p>
    {{ member.name }}
</p>

{% endfor %}

<hr>

<a href="{{ url_for(
    'main.group_expenses',
    group_id=group.id
) }}">
    View Group Expenses
</a>

<br><br>

<a href="{{ url_for(
    'main.add_group_expense',
    group_id=group.id
) }}">
    Add Group Expense
</a>

{% endblock %}
