{% extends "base.html" %}

{% block content %}

<h2>My Groups</h2>

<form method="POST">

    <input
        type="text"
        name="name"
        placeholder="Group Name"
        required
    >

    <button type="submit">
        Create Group
    </button>

</form>

<hr>

{% for group in groups %}

<h3>
    {{ group.name }}
</h3>

<a href="{{ url_for(
    'main.group',
    group_id=group.id
) }}">
    Open Group
</a>

<br><br>

{% endfor %}

{% endblock %}
