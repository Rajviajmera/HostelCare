{% extends "base.html" %}

{% block content %}

<h2>My Groups</h2>

<a href="{{ url_for('main.create_group') }}">
    Create New Group
</a>

<br>
<br>

{% if groups %}

    {% for group in groups %}

        <div>

            <h3>{{ group.group_name }}</h3>

            <a href="{{ url_for('main.add_expense', group_id=group.id) }}">
                Add Expense
            </a>

            |

            <a href="{{ url_for('main.expenses', group_id=group.id) }}">
                View Expenses
            </a>

        </div>

        <hr>

    {% endfor %}

{% else %}

    <p>You have not joined any group yet.</p>

    <a href="{{ url_for('main.create_group') }}">
        Create Your First Group
    </a>

{% endif %}

{% endblock %}
