{% extends "base.html" %}

{% block content %}

<h2>Create Group</h2>

<form method="POST">
    {{ form.hidden_tag() }}

    {{ form.name.label }}
    {{ form.name() }}
    {% for error in form.name.errors %}
        <p>{{ error }}</p>
    {% endfor %}

    <br><br>

    {{ form.submit() }}
</form>

<p><a href="{{ url_for('main.groups') }}">Back to groups</a></p>

{% endblock %}
