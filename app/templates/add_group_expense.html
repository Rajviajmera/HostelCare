{% extends "base.html" %}

{% block content %}

<h2>Add Group Expense</h2>

<p>
    Group: {{ group.name }}
</p>

<form method="POST">

    <p>
        <label>Title</label>
        <br>

        <input
            type="text"
            name="title"
            required
        >
    </p>

    <p>
        <label>Amount</label>
        <br>

        <input
            type="number"
            step="0.01"
            name="amount"
            required
        >
    </p>

    <p>
        <label>Paid By</label>
        <br>

        <input
            type="text"
            name="paid_by"
            required
        >
    </p>

    <button type="submit">
        Add Expense
    </button>

</form>

{% endblock %}
